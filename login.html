
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090711">
  <title>GROVANTA | Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="site-header">
  <a href="index.html" class="logo">GROVANTA<span>.</span></a>
  <a href="index.html" class="nav-button">Home</a>
</header>

<main class="auth-container">
  <section class="auth-card">

    <span class="eyebrow">WELCOME BACK</span>
    <h1>Login to GROVANTA</h1>
    <p class="auth-description">
      Enter your account details to continue.
    </p>

    <form id="loginForm">

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="+2348012345678"
        autocomplete="tel"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <div class="login-options">
        <a href="forgot-password.html">Forgot Password?</a>
      </div>

      <p class="form-notice">
        Secure login will be activated after backend integration.
      </p>

      <button type="submit" class="primary-button auth-submit">
        Login
      </button>

    </form>

    <p class="auth-login">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </p>

  </section>
</main>

<footer class="site-footer">
  <a href="index.html" class="logo">GROVANTA<span>.</span></a>
  <p>Grow Smarter. Build Your Future.</p>
</footer>

</body>
</html>
